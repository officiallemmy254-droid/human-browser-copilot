<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Standard Elements Fixture</title>
</head>
<body>
  <h1>Interactive Elements</h1>
  <button id="btn-submit" type="button">Submit Order</button>
  <button id="btn-cancel" type="button">Cancel</button>
  <button id="btn-disabled" disabled>Disabled Button</button>
  
  <form id="test-form">
    <label for="input-username">Username:</label>
    <input type="text" id="input-username" name="username" placeholder="Enter username">

    <label for="input-email">Email:</label>
    <input type="email" id="input-email" name="email" value="test@example.com">

    <textarea id="textarea-notes" placeholder="Add notes here"></textarea>
  </form>
</body>
</html>
